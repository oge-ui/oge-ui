<header
  class="sticky top-0 z-30 border-b border-gray-200/80 bg-white/85 backdrop-blur-md dark:border-gray-800/80 dark:bg-gray-950/85"
>
  <div class="flex h-14 items-center gap-3 px-5">
    <a routerLink="/" class="flex items-center gap-2.5">
      <img src="favicon-192.png" alt="OGE logo" class="h-8 w-8" />
      <span
        class="text-[15px] font-bold tracking-tight text-gray-900 dark:text-gray-100"
        >OGE</span
      >
      <span
        class="rounded-full border border-gray-200 bg-gray-50 px-2 py-0.5 font-mono text-[11px] leading-4 text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400"
        >v0.4.0</span
      >
    </a>
    <nav class="ml-5 flex items-center gap-1 text-[13px] max-md:hidden">
      <a
        routerLink="/getting-started"
        routerLinkActive="text-gray-900 dark:text-gray-100 bg-gray-100 dark:bg-gray-800/70"
        class="rounded-md px-2.5 py-1.5 font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100"
        >Docs</a
      >
      <a
        routerLink="/components"
        routerLinkActive="text-gray-900 dark:text-gray-100 bg-gray-100 dark:bg-gray-800/70"
        class="rounded-md px-2.5 py-1.5 font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100"
        >Components</a
      >
    </nav>
    <div class="ml-auto flex items-center gap-2.5">
      <label class="flex items-center gap-2 text-[13px]">
        <span class="text-gray-400 max-sm:hidden dark:text-gray-500"
          >Theme</span
        >
        <select
          class="h-8 rounded-md border border-gray-200 bg-white px-2 text-[13px] text-gray-700 outline-none transition-colors focus:border-indigo-400 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:focus:border-indigo-500"
          [value]="themeService.theme()"
          (change)="themeService.theme.set($any($event.target).value)"
        >
          @for (theme of themes; track theme.value) {
          <option [value]="theme.value">{{ theme.label }}</option>
          }
        </select>
      </label>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-md border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-100"
        [attr.aria-label]="
          themeService.mode() === 'dark'
            ? 'Switch to light mode'
            : 'Switch to dark mode'
        "
        (click)="themeService.toggleMode()"
      >
        <app-icon
          [name]="themeService.mode() === 'dark' ? 'sun' : 'moon'"
          [size]="15"
        />
      </button>
      <span class="h-5 w-px bg-gray-200 dark:bg-gray-700"></span>
      <a
        href="https://github.com/kaya2m"
        target="_blank"
        rel="noopener"
        aria-label="GitHub profile"
        class="flex h-8 w-8 items-center justify-center rounded-md text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-100"
      >
        <app-icon name="github" [size]="17" />
      </a>
    </div>
  </div>
</header>
<div
  [class]="
    isHome()
      ? 'flex flex-1 flex-col'
      : 'grid flex-1 grid-cols-[250px_minmax(0,1fr)] max-md:grid-cols-1'
  "
>
  @if (!isHome()) {
  <nav
    class="scrollbar-hide sticky top-14 flex max-h-[calc(100vh-3.5rem)] flex-col overflow-y-auto border-r border-gray-200 bg-gray-50/60 px-3 py-5 max-md:static max-md:max-h-none max-md:border-b max-md:border-r-0 dark:border-gray-800 dark:bg-gray-900/30"
    aria-label="Documentation"
  >
    <div class="relative mb-4 px-1">
      <span
        class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"
      >
        <app-icon name="search" [size]="13" />
      </span>
      <input
        type="search"
        placeholder="Filter pages…"
        class="h-8 w-full rounded-md border border-gray-200 bg-white pl-8 pr-2 text-[13px] text-gray-700 outline-none transition-colors placeholder:text-gray-400 focus:border-indigo-400 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:placeholder:text-gray-500 dark:focus:border-indigo-500"
        [value]="navQuery()"
        (input)="navQuery.set($any($event.target).value)"
      />
    </div>
    @for (section of sections(); track section.title) {
    <div class="mb-1.5">
      <button
        type="button"
        class="flex w-full items-center justify-between rounded-md px-2 py-1.5 text-[11px] font-semibold uppercase tracking-[0.08em] text-gray-500 transition-colors hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100"
        (click)="toggleSection(section.title)"
        [attr.aria-expanded]="!collapsed().has(section.title)"
      >
        {{ section.title }}
        <span
          class="text-gray-400 transition-transform duration-200 dark:text-gray-500"
          [class]="collapsed().has(section.title) ? '-rotate-90' : ''"
        >
          <app-icon name="chevron-down" [size]="13" />
        </span>
      </button>
      <div
        class="grid transition-[grid-template-rows] duration-300 ease-out"
        [class]="
            collapsed().has(section.title)
              ? 'grid-rows-[0fr]'
              : 'grid-rows-[1fr]'
          "
      >
        <div class="overflow-hidden">
          <div class="flex flex-col gap-0.5 py-1">
            @for (item of section.items; track item.path) {
            <a
              [routerLink]="item.path"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLinkActive="bg-indigo-50 font-medium text-indigo-700 hover:bg-indigo-50 hover:text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/10 dark:hover:text-indigo-300"
              class="flex items-center gap-2.5 rounded-md px-2 py-1.5 text-[13.5px] text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800/60 dark:hover:text-gray-100"
            >
              <span class="opacity-70">
                <app-icon [name]="item.icon" [size]="14" />
              </span>
              {{ item.label }}
            </a>
            }
          </div>
        </div>
      </div>
    </div>
    }
    <div
      class="mt-auto flex items-center justify-between border-t border-gray-200 px-2 pt-4 text-[12px] text-gray-400 dark:border-gray-800 dark:text-gray-500"
    >
      <span>OGE UI</span>
      <span class="font-mono">v0.4.0</span>
    </div>
  </nav>
  }
  <main [class]="isHome() ? 'min-w-0' : 'min-w-0 px-8 py-10 max-md:px-4'">
    <div [class]="isHome() ? '' : 'doc-shell'">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
