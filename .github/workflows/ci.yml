name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps

      - run: npx nx format:check --base="remotes/origin/main"
      # the committed llms.txt / sitemap artifacts must match their generator
      - run: npx nx run docs-tools:llms-check
      - run: npx nx run-many -t lint test build typecheck e2e
      # the ng-add bundle only ships if it builds — release runs this too
      - run: npx nx run oge-schematics:schematics
