name: CodeQL

# Static analysis over the library sources. The component packages are the
# part of this repo that runs on someone else's page, so the queries that
# matter here are the injection ones — `security-extended` includes the
# DOM-XSS and unsafe-URL sinks that a render layer can reintroduce in a single
# line, which is exactly the class of bug a review can miss.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # advisories land on their own schedule; a weekly run catches the ones
    # that arrive between pushes
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
