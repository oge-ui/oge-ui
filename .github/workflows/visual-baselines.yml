name: Visual baselines

# Renders the screenshot baselines (apps/dev-app-e2e/visual) on a CI runner —
# the browser in the same Playwright Docker image the `visual` CI job compares
# in — and uploads them as an artifact. Review the PNGs, then commit them under
# apps/dev-app-e2e/visual/__screenshots__ (docs/ARCHITECTURE.md → Testing).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx nx run dev-app-e2e:e2e-visual-update

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: apps/dev-app-e2e/visual/__screenshots__
          if-no-files-found: error
