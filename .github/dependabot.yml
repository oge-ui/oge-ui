version: 2

# Almost every dependency here is build-time only. The exceptions reach
# consumers as *peers*: Angular/React, and the optional export peers (jspdf,
# jspdf-autotable, exceljs) of behavior and the engines — when one of those
# gets an advisory, raise the peer floor in the package manifests too, not
# just the version installed here. The
# Angular and Nx families move together or not at all: a partial bump inside
# either one fails peer resolution, so they are grouped into one PR each.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - 'ng-packagr'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
      tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@nx/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
