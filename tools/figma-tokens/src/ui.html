<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font:
          12px/1.4 Inter,
          system-ui,
          sans-serif;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      p {
        margin: 0 0 10px;
        color: var(--figma-color-text-secondary);
      }
      section {
        margin-bottom: 14px;
      }
      button {
        padding: 6px 10px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        background: var(--figma-color-bg);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--figma-color-bg-brand);
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        margin-top: 8px;
        font:
          11px/1.4 ui-monospace,
          monospace;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #status {
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Import OGE UI tokens</h1>
      <p>
        Creates or updates the “OGE UI” variable collection with Light, Dark and
        High contrast modes. Dev Mode shows each variable as
        <code>var(--oge-…)</code>.
      </p>
      <div class="row">
        <button class="primary" id="import">Import the shipped tokens</button>
        <label>
          <button id="pick" type="button">Import a tokens.json…</button>
          <input id="file" type="file" accept=".json,application/json" hidden />
        </label>
      </div>
    </section>
    <section>
      <h1>Export a theme</h1>
      <p>
        Turns the collection back into a CSS theme of <code>--oge-*</code>
        overrides — load it after the suite’s styles.
      </p>
      <div class="row">
        <button id="export">Export CSS</button>
        <label
          ><input id="changed" type="checkbox" checked /> Only changed
          values</label
        >
      </div>
      <textarea
        id="css"
        readonly
        aria-label="Exported CSS"
        placeholder="The CSS appears here"
      ></textarea>
      <div class="row">
        <button id="copy">Copy</button>
        <button id="download">Download oge-theme.css</button>
      </div>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <script>
      const send = (message) =>
        parent.postMessage({ pluginMessage: message }, '*');
      const status = document.getElementById('status');
      const css = document.getElementById('css');
      document.getElementById('import').onclick = () =>
        send({ type: 'import' });
      document.getElementById('pick').onclick = () =>
        document.getElementById('file').click();
      document.getElementById('file').onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          send({ type: 'import', tokens: JSON.parse(await file.text()) });
        } catch (error) {
          status.textContent = 'Not a tokens.json: ' + error.message;
        }
      };
      document.getElementById('export').onclick = () =>
        send({
          type: 'export',
          changedOnly: document.getElementById('changed').checked,
        });
      document.getElementById('copy').onclick = () => {
        css.select();
        document.execCommand('copy');
        status.textContent = 'Copied';
      };
      document.getElementById('download').onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(
          new Blob([css.value], { type: 'text/css' }),
        );
        link.download = 'oge-theme.css';
        link.click();
      };
      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === 'imported')
          status.textContent = message.count + ' variables imported';
        if (message.type === 'exported') {
          css.value = message.css || '/* nothing changed */';
          status.textContent = message.count + ' variables exported';
        }
        if (message.type === 'error') status.textContent = message.message;
      };
    </script>
  </body>
</html>
